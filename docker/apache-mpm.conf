# A small shared host: only 8 PHP workers. If a background batch hogged workers or ran
# long, visitors would get 503s — the load test checks that never happens.
<IfModule mpm_prefork_module>
	StartServers             2
	MinSpareServers          2
	MaxSpareServers          4
	MaxRequestWorkers        8
	MaxConnectionsPerChild   0
</IfModule>
