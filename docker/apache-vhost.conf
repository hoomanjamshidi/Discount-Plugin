# Port 8088 inside the container too, so WordPress loopback requests to
# http://localhost:8088 (WP-Cron spawn, background chain) reach Apache.
<VirtualHost *:80 *:8088>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
