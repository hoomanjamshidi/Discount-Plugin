# Local test stack for Smart Bulk Discount.
# Simulates a typical (constrained) shared host: 128M memory, 30s max_execution_time.
#   docker compose -f docker/docker-compose.yml up -d
#   bash docker/setup.sh            # installs WP + WooCommerce + plugin
#   bash docker/seed.sh 3000        # generates 3000 products
name: dsd

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    command: --innodb-buffer-pool-size=256M --max-connections=200
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wproot:/var/www/html
      - ../smart-bulk-discount:/var/www/html/wp-content/plugins/smart-bulk-discount
      - ../tests/integration/host-sim.php:/var/www/html/wp-content/mu-plugins/dsd-host-sim.php:ro
      - ./php-constrained.ini:/usr/local/etc/php/conf.d/zz-constrained.ini:ro
      - ./apache-ports.conf:/etc/apache2/ports.conf:ro
      - ./apache-vhost.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      - ./apache-mpm.conf:/etc/apache2/mods-enabled/mpm_prefork.conf:ro

  cli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
    volumes:
      - wproot:/var/www/html
      - ../smart-bulk-discount:/var/www/html/wp-content/plugins/smart-bulk-discount
      - ../tests/integration/host-sim.php:/var/www/html/wp-content/mu-plugins/dsd-host-sim.php:ro
      - ../tests:/tests
      - ./php-cli.ini:/usr/local/etc/php/conf.d/zz-cli.ini:ro
    entrypoint: ["sleep", "infinity"]

  phpunit:
    image: composer:2
    working_dir: /app
    volumes:
      - ..:/app
    entrypoint: ["sleep", "infinity"]

volumes:
  dbdata:
  wproot:
